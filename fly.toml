# fly.toml app configuration file generated for zapnews-swarm-relay on 2025-12-21T09:15:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zapnews-swarm-relay'
primary_region = 'sjc'

[build]
  dockerfile = "Dockerfile"

# Set DATABASE_URL as a secret: fly secrets set DATABASE_URL='postgres://...'
[env]
  RELAY_NAME = "Zapnews Swarm Relay"
  RELAY_PUBKEY = "8ad8f1f78c8e11966242e28a7ca15c936b23a999d5fb91bfe4e4472e2d6eaf55"
  RELAY_DESCRIPTION = "Zapnews Nostr relay"
  DB_ENGINE = "postgres"
  RELAY_PORT = "3334"
  # NPUB_DOMAIN = ""  # Optional: leave empty to use local public/.well-known/nostr.json

[http_service]
  internal_port = 3334
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
