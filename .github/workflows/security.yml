name: Security review

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: true
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-package: ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  container:
    name: Container vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t swarm:security .
      - uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          image-ref: swarm:security
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
