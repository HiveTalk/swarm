name: Build and stage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build immutable image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/hivetalk/swarm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/hivetalk/swarm:sha-${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/hivetalk/swarm
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  staging:
    name: Deploy and verify staging
    if: vars.STAGING_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, x64, swarm-staging]
    environment: staging
    env:
      IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      STAGING_URL: http://127.0.0.1:4334
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install chromium
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start isolated staging relay
        run: |
          docker rm -f swarm-staging || true
          rm -rf "$RUNNER_TEMP/swarm-staging"
          mkdir -p "$RUNNER_TEMP/swarm-staging"
          admin_secret=$(openssl rand -hex 32)
          team_secret=$(openssl rand -hex 32)
          admin_pubkey=$(printf '%s\n' "$admin_secret" | go run ./test/keygen)
          team_pubkey=$(printf '%s\n' "$team_secret" | go run ./test/keygen)
          printf '{"names":{"_":"%s","team":"%s"},"relays":{}}\n' "$admin_pubkey" "$team_pubkey" > "$RUNNER_TEMP/swarm-staging/nostr.json"
          printf 'E2E_ADMIN_SECRET_KEY=%s\nE2E_TEAM_SECRET_KEY=%s\nE2E_PUBLIC_KINDS=1,6,7\nE2E_TEAM_KINDS=0,1,6,7,10002,30311\n' "$admin_secret" "$team_secret" > "$RUNNER_TEMP/swarm-staging/test-env"
          chmod 600 "$RUNNER_TEMP/swarm-staging/nostr.json" "$RUNNER_TEMP/swarm-staging/test-env"
          docker pull "$IMAGE"
          docker run -d --name swarm-staging \
            -p 127.0.0.1:4334:3334 \
            -v "$RUNNER_TEMP/swarm-staging/nostr.json:/app/public/.well-known/nostr.json" \
            -e RELAY_NAME='Swarm Staging' \
            -e RELAY_PUBKEY="$admin_pubkey" \
            -e RELAY_DESCRIPTION='Swarm staging verification relay' \
            -e DB_ENGINE=badger \
            -e DB_PATH=/tmp/swarm-staging-db \
            -e NPUB_DOMAIN= \
            -e BLOSSOM_ENABLED=false \
            -e PUBLIC_ALLOWED_KINDS=1,6,7 \
            -e ALLOWED_KINDS=0,1,6,7,10002,30311 \
            -e COOKIE_SECURE=false \
            -e PUBKEY_RATE_LIMIT= \
            -e IP_RATE_LIMIT= \
            -e CONN_RATE_LIMIT= \
            -e QUERY_RATE_LIMIT= \
            "$IMAGE"
          for attempt in $(seq 1 30); do
            curl -fsS "$STAGING_URL/health/ready" && exit 0
            sleep 1
          done
          docker logs swarm-staging
          exit 1
      - name: Verify staging relay
        run: |
          set -a
          . "$RUNNER_TEMP/swarm-staging/test-env"
          set +a
          E2E_RELAY_URL="$STAGING_URL" go test -v ./test/e2e
          E2E_RELAY_URL="$STAGING_URL" npm run test:e2e
      - name: Record verified release
        run: |
          jq -n \
            --arg image "${{ needs.build.outputs.image }}" \
            --arg digest "${{ needs.build.outputs.digest }}" \
            --arg commit "${{ github.sha }}" \
            '{image: $image, digest: $digest, commit: $commit}' > staging-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-release
          path: staging-release.json
          retention-days: 30
      - name: Stop staging relay
        if: always()
        run: |
          docker logs swarm-staging > staging-relay.log 2>&1 || true
          docker rm -f swarm-staging || true
          rm -rf "$RUNNER_TEMP/swarm-staging"
